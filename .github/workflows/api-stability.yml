name: API Stability CI

on:
  workflow_call:
    inputs:
      swift_versions:
        default: '["6.4", "6.3", "6.2"]'
        description: 'The swift versions to execute the job on'
        required: false
        type: string
      os:
        default: '["ubuntu-latest", "macos-latest"]'
        description: 'The OS to execute the job on'
        required: false
        type: string
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      SSH_PUBLIC_KEY:
        required: true

jobs:
  build_linux:
    strategy:
      matrix:
        os: ${{ fromJSON(inputs.os) }}
        swift: ${{ fromJSON(inputs.swift_versions) }}
    name: Check Swift ${{ matrix.swift }} API Stability on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
      - if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update && sudo apt-get -y install libcurl4-openssl-dev
          curl -O https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz && \
            tar zxf swiftly-$(uname -m).tar.gz && \
            ./swiftly init --quiet-shell-followup --assume-yes --skip-install && \
            . "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/env.sh" && \
            hash -r
          swiftly install --assume-yes ${{ matrix.swift }}

      - if: ${{ runner.os == 'macOS' }}
        run: |
          curl -O https://download.swift.org/swiftly/darwin/swiftly.pkg && \
            installer -pkg swiftly.pkg -target CurrentUserHomeDirectory && \
            ~/.swiftly/bin/swiftly init --quiet-shell-followup --assume-yes --skip-install && \
            . "${SWIFTLY_HOME_DIR:-$HOME/.swiftly}/env.sh" && \
            hash -r
          swiftly install --assume-yes ${{ matrix.swift }}

      - name: Setup SSH Key
        run: | 
          rm -rf ~/.ssh
          mkdir -m 0700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/id_ed25519.pub
          chmod 0600 ~/.ssh/id_ed25519
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_ed25519

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      
      #- name: Reconfigure Private Repo URLs
      #  run: sed -i 's/git@github.com:/https:\/\/${{ secrets.ACCESS_TOKEN }}@github.com\//g' Package.swift

      - name: Check API Stability 
        run: swift package diagnose-api-breaking-changes `git tag | sort --version-sort | tail -n1`
