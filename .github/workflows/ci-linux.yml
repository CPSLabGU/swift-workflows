name: Linux CI

on:
  workflow_call:
    inputs:
      os:
        default: '["ubuntu-latest", "ubuntu-24.04"]'
        description: 'The linux versions to execute the job on'
        required: false
        type: string
      build_modes:
        default: '["debug", "release"]'
        description: 'The build modes to execute the job on'
        required: false
        type: string
      swift_versions:
        default: '["6.4"]'
        description: 'The swift versions to execute the job on'
        required: false
        type: string
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      SSH_PUBLIC_KEY:
        required: true

jobs:
  build_linux:
    strategy:
      matrix:
        os: ${{ fromJSON(inputs.os) }}
        swift: ${{ fromJSON(inputs.swift_versions) }}
        build_mode: ${{ fromJSON(inputs.build_modes) }}
    name: Swift ${{ matrix.swift }} ${{ matrix.build_mode }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Install Swift
        run: |
          apt-get update && apt-get -y install libcurl4-openssl-dev
          curl -O https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz && \
            tar zxf swiftly-$(uname -m).tar.gz && \
            ./swiftly init --quiet-shell-followup --assume-yes --skip-install && \
            . "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/env.sh" && \
            hash -r
          swiftly install --assume-yes ${{ matrix.swift }}

      - name: Setup SSH Key
        run: | 
          rm -rf ~/.ssh
          mkdir -m 0700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/id_ed25519.pub
          chmod 0600 ~/.ssh/id_ed25519
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_ed25519

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          path: 'repo'
      
      #- name: Reconfigure Private Repo URLs
      #  run: sed -i 's/git@github.com:/https:\/\/${{ secrets.ACCESS_TOKEN }}@github.com\//g' Package.swift

      - name: build
        shell: bash -l {0}
        run: cd repo && swift build -c ${{ matrix.build_mode }}

      - name: Test
        shell: bash -l {0}
        run: cd repo && swift test -c ${{ matrix.build_mode }}

  ci-linux-report:
    runs-on: ubuntu-latest
    needs: build_linux
    if: always()
    steps:
      - name: All tests ok
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: exit 0
      - name: Some tests failed
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
