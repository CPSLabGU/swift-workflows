name: Swift Lint 

on:
  workflow_call:
    inputs:
      format_config_path:
        required: false
        description: 'The configuration file for SwiftFormat (path). Defaults to `.swiftformat.json`.'
        default: '.swiftformat.json'
        type: string
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      SSH_PUBLIC_KEY:
        required: true

jobs:

  # swiftlint:
  #   runs-on: ubuntu-latest

  #   steps:
  #     - name: Clone Repo 
  #       uses: actions/checkout@v4

  #     #- name: Reconfigure Private Repo URLs
  #     #  run: sed -i 's/git@github.com:/https:\/\/${{ secrets.ACCESS_TOKEN }}@github.com\//g' Package.swift
      
  #     - name: SwiftLint
  #       uses: norio-nomura/action-swiftlint@3.2.1
  #       with:
  #           args: --strict

  swiftformat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Swiftenv
        uses: actions/checkout@v4
        with:
          repository: kylef/swiftenv
          path: .swiftenv

      - name: Setup Swiftenv
        run: |
          echo 'export SWIFTENV_ROOT="${{ github.workspace }}/.swiftenv"' >> $HOME/.bash_profile
          echo 'export PATH="$SWIFTENV_ROOT/bin:$PATH"' >> $HOME/.bash_profile
          echo 'eval "$(swiftenv init -)"' >> $HOME/.bash_profile
      
      - name: Install Swift
        shell: bash -l {0}
        run: swiftenv install 6.4

      - name: Setup SSH Key
        run: | 
          rm -rf ~/.ssh
          mkdir -m 0700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/id_ed25519.pub
          chmod 0600 ~/.ssh/id_ed25519
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_ed25519

      - name: Clone Repo
        uses: actions/checkout@v4

      - name: SwiftFormat
        shell: bash -l {0}
        run: swift format lint -rs --configuration ${{ inputs.format_config_path }} Sources Tests
  
  swiftlint-report:
    runs-on: ubuntu-latest
    needs: [swiftformat]
    if: always()
    steps:
      - name: All tests ok
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: exit 0
      - name: Some tests failed
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
