name: Swift Lint 

on:
  workflow_call:
    inputs:
      format_config_path:
        required: false
        description: 'The configuration file for SwiftFormat (path). Defaults to `.swiftformat.json`.'
        default: '.swiftformat.json'
        type: string
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      SSH_PUBLIC_KEY:
        required: true

jobs:

  # swiftlint:
  #   runs-on: ubuntu-latest

  #   steps:
  #     - name: Clone Repo 
  #       uses: actions/checkout@v4

  #     #- name: Reconfigure Private Repo URLs
  #     #  run: sed -i 's/git@github.com:/https:\/\/${{ secrets.ACCESS_TOKEN }}@github.com\//g' Package.swift
      
  #     - name: SwiftLint
  #       uses: norio-nomura/action-swiftlint@3.2.1
  #       with:
  #           args: --strict

  swiftformat:
    runs-on: ubuntu-latest
    steps:
      - name: Install Swift
        run: |
          sudo apt-get update && sudo apt-get -y install libcurl4-openssl-dev
          curl -O https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz && \
            tar zxf swiftly-$(uname -m).tar.gz && \
            ./swiftly init --quiet-shell-followup --assume-yes && \
            . "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/env.sh" && \
            hash -r

      - name: Setup SSH Key
        run: | 
          rm -rf ~/.ssh
          mkdir -m 0700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/id_ed25519.pub
          chmod 0600 ~/.ssh/id_ed25519
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_ed25519

      - name: Clone Repo
        uses: actions/checkout@v4

      - name: SwiftFormat
        id: swiftformat
        run: swift format lint -rs --configuration ${{ inputs.format_config_path }} Sources Tests
      
      # - name: All tests ok
      #   if: ${{ !(contains(steps.swiftformat.outcome, 'failure')) }}
      #   run: exit 0
      # - name: Some tests failed
      #   if: ${{ contains(steps.swiftformat.outcome, 'failure') }}
      #   run: exit 1
  
  swiftlint-report:
    runs-on: ubuntu-latest
    needs: [swiftformat]
    if: always()
    steps:
      - name: All tests ok
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: exit 0
      - name: Some tests failed
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
